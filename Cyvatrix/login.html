<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyvatrix | Login</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <div class="site-shell auth-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Cyvatrix home"><img src="assets/logo.svg" alt="" width="36" height="36"><span>Cyvatrix</span></a>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link primary active-primary" aria-current="page" href="login.html">Login</a>
      </nav>
    </header>
    <main class="auth-main">
      <section class="auth-panel" aria-labelledby="login-title">
        <h1 id="login-title">Welcome Back</h1>
        <p class="subtitle">Sign in to continue to your Cyvatrix account.</p>
        <form data-demo-form="login" class="auth-form">
          <div class="field">
            <label for="email">Email Address</label>
            <div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap"><span class="input-icon" aria-hidden="true">♙</span><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="reveal-button" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">Show</button></div>
          </div>
          <div class="form-row"><label class="check-label"><input type="checkbox" name="remember"> Remember me</label><span class="muted small">Password recovery coming later</span></div>
          <button class="btn btn-primary btn-full" type="submit">Sign In</button>
          <p class="form-message" role="status" aria-live="polite"></p>
        </form>
        <p class="form-switch">Don't have an account? <a href="register.html">Register</a></p>
      </section>
    </main>
  </div>
</body>
</html>
