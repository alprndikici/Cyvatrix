<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyvatrix | Register</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <div class="site-shell auth-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Cyvatrix home"><img src="assets/logo.svg" alt="" width="36" height="36"><span>Cyvatrix</span></a>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link primary" href="login.html">Login</a>
      </nav>
    </header>
    <main class="auth-main register-main">
      <section class="auth-panel" aria-labelledby="register-title">
        <h1 id="register-title">Create Your Account</h1>
        <p class="subtitle">Start your security journey with Cyvatrix.</p>
        <form data-demo-form="register" class="auth-form">
          <div class="field"><label for="username">Username</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">♙</span><input id="username" name="username" type="text" placeholder="Choose a username" autocomplete="username" minlength="3" maxlength="30" required></div></div>
          <div class="field"><label for="email">Email Address</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div></div>
          <div class="field"><label for="password">Password</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">♙</span><input id="password" name="password" type="password" placeholder="Create a strong password" autocomplete="new-password" minlength="8" required><button class="reveal-button" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">Show</button></div></div>
          <div class="field"><label for="confirm-password">Confirm Password</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">♙</span><input id="confirm-password" name="confirm-password" type="password" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required><button class="reveal-button" type="button" data-toggle-password="confirm-password" aria-label="Show password confirmation" aria-pressed="false">Show</button></div></div>
          <button class="btn btn-primary btn-full" type="submit">Create Account</button>
          <p class="form-message" role="status" aria-live="polite"></p>
        </form>
        <p class="form-switch">Already have an account? <a href="login.html">Sign In</a></p>
      </section>
    </main>
  </div>
</body>
</html>
